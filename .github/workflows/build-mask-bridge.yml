name: Publish Spine Mask + Resize Chrome Bridge installer
on:
  push:
    branches: [main]
    paths:
      - spine-bridge/**
      - .github/workflows/build-mask-bridge.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-host:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native Windows executable from the audited host
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --console --name spinemaskbridge spine-bridge/spinemaskbridge.py
          if (-not (Test-Path "dist/spinemaskbridge.exe")) { throw "Windows host missing" }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SpineMaskInstaller `
            --add-data "spine-bridge/manifest.json;assets" `
            --add-data "spine-bridge/background.js;assets" `
            --add-data "spine-bridge/content.js;assets" `
            --add-data "spine-bridge/mask-content.js;assets" `
            --add-data "spine-bridge/popup.html;assets" `
            --add-data "spine-bridge/popup.js;assets" `
            --add-data "spine-bridge/icon_16.png;assets" `
            --add-data "spine-bridge/icon_48.png;assets" `
            --add-data "spine-bridge/icon_128.png;assets" `
            --add-binary "dist/spinemaskbridge.exe;." `
            spine-bridge/launch_spinemask_portable.py
          if (-not (Test-Path "dist/SpineMaskInstaller.exe")) { throw "One-click Windows installer missing" }
      - name: Verify Windows Native Messaging stdio ping
        shell: pwsh
        run: |
          @'
          import json, struct, subprocess
          msg=json.dumps({"id":1,"method":"ping","params":{}}).encode()
          frame=struct.pack("<I",len(msg))+msg
          p=subprocess.run(["dist/spinemaskbridge.exe"],input=frame,
                           capture_output=True,timeout=25)
          assert p.returncode==0, f"host exited {p.returncode}"
          assert len(p.stdout)>=4,"no native response"
          count=struct.unpack("<I",p.stdout[:4])[0]
          result=json.loads(p.stdout[4:4+count])
          assert result["result"]["protocol"]=="spinemask/1",result
          print("SPINE_MASK_WINDOWS_NATIVE_PING_PASS")
          '@ | Set-Content -Path validate_host.py -Encoding utf8
          python validate_host.py
      - uses: actions/upload-artifact@v4
        with:
          name: spinemaskbridge-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 5

  publish:
    needs: [windows-host]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: spinemaskbridge-windows
          path: windows-host
      - name: Build release with both macOS native host and Windows executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/spine-mask-resize-bridge
          for asset in manifest.json background.js mask-content.js content.js \
            popup.html popup.js icon_16.png icon_48.png icon_128.png \
            spinemaskbridge.py install_spinemask_host.py launch_spinemask_mac.py \
            launch_spinemask_portable.py install_spinemask_linux.sh \
            INSTALL.command INSTALL.sh INSTALL.bat; do
            test -s "spine-bridge/$asset"
            cp "spine-bridge/$asset" "dist/spine-mask-resize-bridge/$asset"
          done
          test -s windows-host/spinemaskbridge.exe
          cp windows-host/spinemaskbridge.exe dist/spine-mask-resize-bridge/
          cp windows-host/SpineMaskInstaller.exe dist/spine-mask-resize-bridge/
          chmod 755 dist/spine-mask-resize-bridge/INSTALL.command dist/spine-mask-resize-bridge/INSTALL.sh
          chmod 755 dist/spine-mask-resize-bridge/spinemaskbridge.py
          node --check dist/spine-mask-resize-bridge/background.js
          node --check dist/spine-mask-resize-bridge/mask-content.js
          python3 - <<'PY'
          from pathlib import Path
          for name in ('spinemaskbridge.py','install_spinemask_host.py','launch_spinemask_mac.py','launch_spinemask_portable.py'):
              p=Path('dist/spine-mask-resize-bridge')/name
              compile(p.read_bytes(),str(p),'exec')
          PY
          python3 spine-bridge/test_spinemaskbridge.py
          node spine-bridge/test_mask_extension.mjs
          cd dist
          zip -q -X -r Spine-Mask-Resize-Bridge.zip spine-mask-resize-bridge
          unzip -t Spine-Mask-Resize-Bridge.zip >/dev/null
          test "$(unzip -Z1 Spine-Mask-Resize-Bridge.zip | awk '/\.(png|jpg|jpeg|psd|spine)$/ && !/icon_/ {n++} END{print n+0}')" -eq 0
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq spinemaskbridge.exe
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq SpineMaskInstaller.exe
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq launch_spinemask_portable.py
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq INSTALL.command
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq INSTALL.bat
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq INSTALL.sh
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq launch_spinemask_mac.py
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq install_spinemask_linux.sh
          bash -n spine-mask-resize-bridge/install_spinemask_linux.sh
          bash -n spine-mask-resize-bridge/INSTALL.command
          bash -n spine-mask-resize-bridge/INSTALL.sh
          sha256sum Spine-Mask-Resize-Bridge.zip
          echo 'SPINE_MASK_MAC_WINDOWS_LINUX_PACKAGE_PASS'
      - name: Publish verified extension and native hosts in existing Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="spine-mask-bridge-v1"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title 'Spine Mask + Resize Native Chrome Bridge' \
              --notes 'Chrome MV3 extension, native host for macOS, Windows and Linux, local-only project import.' \
              --target main
          fi
          gh release upload "$TAG" "dist/Spine-Mask-Resize-Bridge.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "SPINE_MASK_RELEASE_PASS https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
