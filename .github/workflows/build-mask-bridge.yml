name: Publish Spine Mask + Resize Chrome Bridge installer
on:
  push:
    branches: [main]
    paths:
      - spine-bridge/**
      - .github/workflows/build-mask-bridge.yml
  pull_request:
    paths:
      - spine-bridge/**
      - .github/workflows/build-mask-bridge.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-host:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native Windows executable from the audited host
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --console --name spinemaskbridge spine-bridge/spinemaskbridge.py
          if (-not (Test-Path "dist/spinemaskbridge.exe")) { throw "Windows host missing" }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SpineMaskInstaller --hidden-import tkinter --hidden-import tkinter.messagebox `
            --add-data "spine-bridge/manifest.json;assets" `
            --add-data "spine-bridge/background.js;assets" `
            --add-data "spine-bridge/content.js;assets" `
            --add-data "spine-bridge/mask-content.js;assets" `
            --add-data "spine-bridge/popup.html;assets" `
            --add-data "spine-bridge/popup.js;assets" `
            --add-data "spine-bridge/icon_16.png;assets" `
            --add-data "spine-bridge/icon_48.png;assets" `
            --add-data "spine-bridge/icon_128.png;assets" `
            --add-binary "dist/spinemaskbridge.exe;." `
            spine-bridge/launch_spinemask_portable.py
          if (-not (Test-Path "dist/SpineMaskInstaller.exe")) { throw "One-click Windows installer missing" }
      - name: Verify Windows installer package resources using a console diagnostic twin
        shell: pwsh
        run: |
          $diagDist = Join-Path $env:RUNNER_TEMP "spinemask-diag-dist"
          $diagWork = Join-Path $env:RUNNER_TEMP "spinemask-diag-work"
          python -m PyInstaller --noconfirm --clean --onefile --console --name SpineMaskInstallerDiagnostic --workpath $diagWork --distpath $diagDist --hidden-import tkinter --hidden-import tkinter.messagebox `
            --add-data "spine-bridge/manifest.json;assets" `
            --add-data "spine-bridge/background.js;assets" `
            --add-data "spine-bridge/content.js;assets" `
            --add-data "spine-bridge/mask-content.js;assets" `
            --add-data "spine-bridge/popup.html;assets" `
            --add-data "spine-bridge/popup.js;assets" `
            --add-data "spine-bridge/icon_16.png;assets" `
            --add-data "spine-bridge/icon_48.png;assets" `
            --add-data "spine-bridge/icon_128.png;assets" `
            --add-binary "dist/spinemaskbridge.exe;." `
            spine-bridge/launch_spinemask_portable.py
          if (-not (Test-Path (Join-Path $diagDist "SpineMaskInstallerDiagnostic.exe"))) { throw "Diagnostic installer build missing" }
          $env:SPINE_MASK_SELF_TEST_OUTPUT = Join-Path $env:RUNNER_TEMP "spinemask-diagnostic-selftest.json"
          & (Join-Path $diagDist "SpineMaskInstallerDiagnostic.exe") --self-test
          if (Test-Path $env:SPINE_MASK_SELF_TEST_OUTPUT) { Get-Content $env:SPINE_MASK_SELF_TEST_OUTPUT }
          if ($LASTEXITCODE -ne 0) { throw "Windows diagnostic installer self-test failed" }
      - name: Verify Windows Native Messaging stdio ping
        shell: pwsh
        run: |
          @'
          import json, struct, subprocess
          msg=json.dumps({"id":1,"method":"ping","params":{}}).encode()
          frame=struct.pack("<I",len(msg))+msg
          p=subprocess.run(["dist/spinemaskbridge.exe"],input=frame,
                           capture_output=True,timeout=25)
          assert p.returncode==0, f"host exited {p.returncode}"
          assert len(p.stdout)>=4,"no native response"
          count=struct.unpack("<I",p.stdout[:4])[0]
          result=json.loads(p.stdout[4:4+count])
          assert result["result"]["protocol"]=="spinemask/1",result
          print("SPINE_MASK_WINDOWS_NATIVE_PING_PASS")
          '@ | Set-Content -Path validate_host.py -Encoding utf8
          python validate_host.py
      - uses: actions/upload-artifact@v4
        with:
          name: spinemaskbridge-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 5

  macos-host:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standalone macOS native host and installer app
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --console --target-architecture universal2 --name spinemaskbridge spine-bridge/spinemaskbridge.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --target-architecture universal2 --name SpineMaskInstaller --hidden-import tkinter --hidden-import tkinter.messagebox \
            --add-data "spine-bridge/manifest.json:assets" \
            --add-data "spine-bridge/background.js:assets" \
            --add-data "spine-bridge/content.js:assets" \
            --add-data "spine-bridge/mask-content.js:assets" \
            --add-data "spine-bridge/popup.html:assets" \
            --add-data "spine-bridge/popup.js:assets" \
            --add-data "spine-bridge/icon_16.png:assets" \
            --add-data "spine-bridge/icon_48.png:assets" \
            --add-data "spine-bridge/icon_128.png:assets" \
            --add-binary "dist/spinemaskbridge:." \
            spine-bridge/launch_spinemask_portable.py
          test -x dist/spinemaskbridge
          test -x dist/SpineMaskInstaller.app/Contents/MacOS/SpineMaskInstaller
      - name: Verify macOS native host protocol and installer startup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,struct,subprocess
          msg=json.dumps({"id":1,"method":"ping","params":{}}).encode()
          frame=struct.pack("<I",len(msg))+msg
          p=subprocess.run(["dist/spinemaskbridge"],input=frame,capture_output=True,timeout=25)
          assert p.returncode==0,f"macOS host exited {p.returncode}"
          assert len(p.stdout)>=4,"macOS host returned no frame"
          size=struct.unpack("<I",p.stdout[:4])[0]
          result=json.loads(p.stdout[4:4+size])
          assert result["result"]["protocol"]=="spinemask/1",result
          print("SPINE_MASK_MACOS_NATIVE_PING_PASS")
          PY
          export SPINE_MASK_SELF_TEST_OUTPUT="$RUNNER_TEMP/spinemask-installer-selftest.json"
          dist/SpineMaskInstaller.app/Contents/MacOS/SpineMaskInstaller --self-test
          cat "$SPINE_MASK_SELF_TEST_OUTPUT"
          echo "SPINE_MASK_MACOS_INSTALLER_STARTUP_PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: spinemaskbridge-macos
          path: |
            dist/spinemaskbridge
            dist/SpineMaskInstaller.app
          if-no-files-found: error
          retention-days: 5

  linux-host:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standalone Linux native host and installer
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --console --name spinemaskbridge spine-bridge/spinemaskbridge.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SpineMaskInstaller --hidden-import tkinter --hidden-import tkinter.messagebox \
            --add-data "spine-bridge/manifest.json:assets" \
            --add-data "spine-bridge/background.js:assets" \
            --add-data "spine-bridge/content.js:assets" \
            --add-data "spine-bridge/mask-content.js:assets" \
            --add-data "spine-bridge/popup.html:assets" \
            --add-data "spine-bridge/popup.js:assets" \
            --add-data "spine-bridge/icon_16.png:assets" \
            --add-data "spine-bridge/icon_48.png:assets" \
            --add-data "spine-bridge/icon_128.png:assets" \
            --add-binary "dist/spinemaskbridge:." \
            spine-bridge/launch_spinemask_portable.py
          test -x dist/spinemaskbridge
          test -x dist/SpineMaskInstaller
      - name: Verify Linux native host protocol and installer startup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,struct,subprocess
          msg=json.dumps({"id":1,"method":"ping","params":{}}).encode()
          frame=struct.pack("<I",len(msg))+msg
          p=subprocess.run(["dist/spinemaskbridge"],input=frame,capture_output=True,timeout=25)
          assert p.returncode==0,f"Linux host exited {p.returncode}"
          assert len(p.stdout)>=4,"Linux host returned no frame"
          size=struct.unpack("<I",p.stdout[:4])[0]
          result=json.loads(p.stdout[4:4+size])
          assert result["result"]["protocol"]=="spinemask/1",result
          print("SPINE_MASK_LINUX_NATIVE_PING_PASS")
          PY
          export SPINE_MASK_SELF_TEST_OUTPUT="$RUNNER_TEMP/spinemask-installer-selftest.json"
          dist/SpineMaskInstaller --self-test
          cat "$SPINE_MASK_SELF_TEST_OUTPUT"
          echo "SPINE_MASK_LINUX_INSTALLER_STARTUP_PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: spinemaskbridge-linux
          path: |
            dist/spinemaskbridge
            dist/SpineMaskInstaller
          if-no-files-found: error
          retention-days: 5

  publish:
    if: github.event_name != 'pull_request'
    needs: [windows-host, macos-host, linux-host]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: spinemaskbridge-windows
          path: windows-host
      - uses: actions/download-artifact@v4
        with:
          name: spinemaskbridge-macos
          path: macos-host
      - uses: actions/download-artifact@v4
        with:
          name: spinemaskbridge-linux
          path: linux-host
      - name: Build release with both macOS native host and Windows executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/spine-mask-resize-bridge/{macos,linux,windows}
          for asset in manifest.json background.js mask-content.js content.js \
            popup.html popup.js icon_16.png icon_48.png icon_128.png \
            spinemaskbridge.py install_spinemask_host.py launch_spinemask_mac.py \
            launch_spinemask_portable.py agent_cli.py README.md install_spinemask_linux.sh \
            INSTALL.command INSTALL.sh INSTALL.bat INSTALL.desktop; do
            test -s "spine-bridge/$asset"
            cp "spine-bridge/$asset" "dist/spine-mask-resize-bridge/$asset"
          done
          test -s windows-host/spinemaskbridge.exe
          test -s windows-host/SpineMaskInstaller.exe
          test -s macos-host/spinemaskbridge
          test -s macos-host/SpineMaskInstaller.app/Contents/MacOS/SpineMaskInstaller
          test -s linux-host/spinemaskbridge
          test -s linux-host/SpineMaskInstaller
          cp windows-host/spinemaskbridge.exe dist/spine-mask-resize-bridge/windows/
          cp windows-host/SpineMaskInstaller.exe dist/spine-mask-resize-bridge/windows/
          cp macos-host/spinemaskbridge dist/spine-mask-resize-bridge/macos/
          cp -R macos-host/SpineMaskInstaller.app dist/spine-mask-resize-bridge/macos/
          cp linux-host/spinemaskbridge dist/spine-mask-resize-bridge/linux/
          cp linux-host/SpineMaskInstaller dist/spine-mask-resize-bridge/linux/
          chmod 755 dist/spine-mask-resize-bridge/INSTALL.command dist/spine-mask-resize-bridge/INSTALL.sh dist/spine-mask-resize-bridge/INSTALL.desktop
          chmod 755 dist/spine-mask-resize-bridge/macos/spinemaskbridge
          chmod 755 dist/spine-mask-resize-bridge/macos/SpineMaskInstaller.app/Contents/MacOS/SpineMaskInstaller
          chmod 755 dist/spine-mask-resize-bridge/linux/spinemaskbridge dist/spine-mask-resize-bridge/linux/SpineMaskInstaller
          chmod 755 dist/spine-mask-resize-bridge/spinemaskbridge.py
          node --check dist/spine-mask-resize-bridge/background.js
          node --check dist/spine-mask-resize-bridge/mask-content.js
          python3 - <<'PY'
          from pathlib import Path
          for name in ('spinemaskbridge.py','install_spinemask_host.py','launch_spinemask_mac.py','launch_spinemask_portable.py','agent_cli.py'):
              p=Path('dist/spine-mask-resize-bridge')/name
              compile(p.read_bytes(),str(p),'exec')
          PY
          python3 spine-bridge/test_spinemaskbridge.py
          python3 spine-bridge/test_spinemask_platforms.py
          node spine-bridge/test_mask_extension.mjs
          bash -n spine-bridge/INSTALL.command spine-bridge/INSTALL.sh
          cd dist
          zip -q -X -r Spine-Mask-Resize-Bridge.zip spine-mask-resize-bridge
          unzip -t Spine-Mask-Resize-Bridge.zip >/dev/null
          mkdir -p platform-windows platform-macos/macos platform-linux/linux
          cp ../windows-host/SpineMaskInstaller.exe platform-windows/Spine-Mask-Bridge-Windows.exe
          cp -R ../macos-host/SpineMaskInstaller.app platform-macos/macos/
          cp ../spine-bridge/INSTALL.command platform-macos/INSTALL.command
          (cd platform-macos && zip -q -X -r ../Spine-Mask-Bridge-macOS.zip .)
          cp ../linux-host/SpineMaskInstaller platform-linux/linux/
          cp ../linux-host/spinemaskbridge platform-linux/linux/
          cp ../spine-bridge/INSTALL.desktop platform-linux/INSTALL.desktop
          cp ../spine-bridge/README.md platform-linux/README.md
          chmod 755 platform-linux/INSTALL.desktop platform-linux/linux/SpineMaskInstaller platform-linux/linux/spinemaskbridge
          tar -czf Spine-Mask-Bridge-Linux.tar.gz -C platform-linux .
          unzip -t Spine-Mask-Bridge-macOS.zip >/dev/null
          tar -tzf Spine-Mask-Bridge-Linux.tar.gz >/dev/null
          test -s platform-windows/Spine-Mask-Bridge-Windows.exe
          test -s Spine-Mask-Bridge-macOS.zip
          test -s Spine-Mask-Bridge-Linux.tar.gz
          echo 'SPINE_MASK_DIRECT_PLATFORM_INSTALLERS_PASS'
          test "$(unzip -Z1 Spine-Mask-Resize-Bridge.zip | awk '/\.(png|jpg|jpeg|psd|spine)$/ && !/icon_/ {n++} END{print n+0}')" -eq 0
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq windows/spinemaskbridge.exe
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq windows/SpineMaskInstaller.exe
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq macos/spinemaskbridge
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq macos/SpineMaskInstaller.app/Contents/MacOS/SpineMaskInstaller
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq linux/spinemaskbridge
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq linux/SpineMaskInstaller
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq launch_spinemask_portable.py
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq INSTALL.command
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq INSTALL.bat
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq INSTALL.sh
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq INSTALL.desktop
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq launch_spinemask_mac.py
          unzip -Z1 Spine-Mask-Resize-Bridge.zip | grep -Fq install_spinemask_linux.sh
          bash -n spine-mask-resize-bridge/install_spinemask_linux.sh
          bash -n spine-mask-resize-bridge/INSTALL.command
          bash -n spine-mask-resize-bridge/INSTALL.sh
          sha256sum Spine-Mask-Resize-Bridge.zip
          echo 'SPINE_MASK_MAC_WINDOWS_LINUX_ONE_CLICK_PACKAGE_PASS'
      - name: Publish verified extension and native hosts in existing Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="spine-mask-bridge-v1"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title 'Spine Mask + Resize Native Chrome Bridge' \
              --notes 'Chrome MV3 extension, native host for macOS, Windows and Linux, local-only project import.' \
              --target main
          fi
          gh release upload "$TAG" "dist/Spine-Mask-Resize-Bridge.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" "dist/platform-windows/Spine-Mask-Bridge-Windows.exe" \
            "dist/Spine-Mask-Bridge-macOS.zip" "dist/Spine-Mask-Bridge-Linux.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "SPINE_MASK_RELEASE_PASS https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
