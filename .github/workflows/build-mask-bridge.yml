name: Build Spine Mask Bridge via public executor repository
on:
  push:
    branches: [main]
    paths:
      - spine-bridge/**
      - .github/workflows/build-mask-bridge.yml
  pull_request:
    paths:
      - spine-bridge/**
      - .github/workflows/build-mask-bridge.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  public-platform-build:
    name: Delegate Windows, macOS and Ubuntu jobs to sa-public-runner
    uses: SpineAnimator/sa-public-runner/.github/workflows/build-mask-bridge.yml@0e24966ebeff11046f6463d1bd4fe4945dc60ad1
    permissions:
      contents: write
