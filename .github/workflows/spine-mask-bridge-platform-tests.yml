name: Spine Mask Bridge platform contracts via public executors
on:
  push:
    branches: [main]
    paths:
      - spine-bridge/**
      - app.js
      - index.html
      - INSTALL_BRIDGE.md
      - .github/workflows/spine-mask-bridge-platform-tests.yml
  pull_request:
    paths:
      - spine-bridge/**
      - app.js
      - index.html
      - INSTALL_BRIDGE.md
      - .github/workflows/spine-mask-bridge-platform-tests.yml
permissions:
  contents: read
jobs:
  public-executor:
    name: Delegate all jobs to sa-public-runner
    uses: SpineAnimator/sa-public-runner/.github/workflows/spine-mask-bridge-platform-tests.yml@6fa2453454fbb8115c51ff8f33dabcbeec3aa1c5
    permissions:
      contents: read
