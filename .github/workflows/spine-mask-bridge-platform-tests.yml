name: Spine Mask Bridge platform contracts
on:
  pull_request:
    paths:
      - spine-bridge/**
      - .github/workflows/spine-mask-bridge-platform-tests.yml
  push:
    branches: [main]
    paths:
      - spine-bridge/**
      - .github/workflows/spine-mask-bridge-platform-tests.yml
permissions:
  contents: read
jobs:
  platform-discovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test explicit project discovery and native host contracts
        run: |
          python spine-bridge/test_spinemask_platforms.py
      - name: Test native messaging and privacy regression suite on Linux
        if: runner.os == 'Linux'
        run: python spine-bridge/test_spinemaskbridge.py
