name: Spine-Resize SA agent API contract
on:
  push:
    branches: [main]
    paths:
      - app.js
      - tools/sa-agent-api-contract.mjs
      - .github/workflows/sa-agent-api-contract.yml
  workflow_dispatch:
  pull_request:
    paths:
      - app.js
      - tools/sa-agent-api-contract.mjs
      - .github/workflows/sa-agent-api-contract.yml
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production bundle syntax
        run: node --check app.js
      - name: Verify SA browser API
        run: node tools/sa-agent-api-contract.mjs
