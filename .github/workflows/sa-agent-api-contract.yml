name: Spine-Resize SA agent API contract via public executor
on:
  push:
    branches: [main]
    paths:
      - app.js
      - tools/sa-agent-api-contract.mjs
      - .github/workflows/sa-agent-api-contract.yml
  pull_request:
    paths:
      - app.js
      - tools/sa-agent-api-contract.mjs
      - .github/workflows/sa-agent-api-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-executor:
    name: Delegate all jobs to sa-public-runner
    uses: SpineAnimator/sa-public-runner/.github/workflows/sa-agent-api-contract.yml@c3aad4d3fcb9cac0584f99f4b0bd3888301392e1
    permissions:
      contents: read
