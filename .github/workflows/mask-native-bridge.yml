name: Spine Mask native messaging and privacy regression via public executor
on:
  push:
    branches: [main]
    paths:
      - spine-bridge/spinemaskbridge.py
      - spine-bridge/install_spinemask_host.py
      - spine-bridge/background.js
      - spine-bridge/mask-content.js
      - spine-bridge/manifest.json
      - spine-bridge/test_spinemaskbridge.py
      - spine-bridge/test_mask_extension.mjs
      - .github/workflows/mask-native-bridge.yml
  pull_request:
    paths:
      - spine-bridge/spinemaskbridge.py
      - spine-bridge/install_spinemask_host.py
      - spine-bridge/background.js
      - spine-bridge/mask-content.js
      - spine-bridge/manifest.json
      - spine-bridge/test_spinemaskbridge.py
      - spine-bridge/test_mask_extension.mjs
      - .github/workflows/mask-native-bridge.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-executor:
    name: Delegate all jobs to sa-public-runner
    uses: SpineAnimator/sa-public-runner/.github/workflows/mask-native-bridge.yml@a1e521467012ee0ceae29c4dd8f1d3908eefee4c
    permissions:
      contents: read
