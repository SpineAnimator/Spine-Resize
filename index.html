<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spine Skeleton Resize</title>
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"%3E%3Crect width="32" height="32" fill="%23000" /%3E%3Crect x="7" y="7" width="18" height="18" fill="none" stroke="\#f2f2f2" stroke-width="2" /%3E%3C/svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display="swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #f2f2f2; }
    body {
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      overflow: hidden;
    }
    main {
      height: 100dvh;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 32px;
      display: grid;
      grid-template-areas:
        "header header"
        "fields fields"
        "panels panels"
        "actions actions";
      grid-template-rows: auto auto 1fr auto;
      gap: 16px;
    }
    .actions {
      grid-area: actions;
      display: flex;
      gap: 8px;
      width: 100%;
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; grid-area: header; }
    h1 { margin: 0; font-size: 1.2rem; font-weight: 500; letter-spacing: -0.02em; }
    button, label { font: inherit; }
    button { cursor: pointer; }
    .chips { display: flex; gap: 8px; }
    .chip { height: 44px; padding: 0 12px; border: 1px solid #2a2a2a; background: #000; color: #8a8a8a; }
    .chip[aria-pressed="true"] { background: #f2f2f2; color: #000; border-color: #f2f2f2; }
    .fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
    .field {
      display: grid;
      grid-template-columns: auto minmax(40px, auto) auto;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid #2a2a2a;
      background: #000;
      color: #8a8a8a;
      min-height: 44px;
    }
    .field input[type="number"] {
      width: 100%;
      background: transparent;
      color: inherit;
      border: 0;
      font: inherit;
      font-size: 1rem;
      outline: none;
      min-width: 40px;
    }
    .field input[type="radio"] {
      appearance: none;
      width: 14px;
      height: 14px;
      border: 1.5px solid currentColor;
      border-radius: 50%;
      background: transparent;
      color: inherit;
    }
    .field input[type="radio"]:checked {
      background: radial-gradient(circle, currentColor 0 45%, transparent 50%);
    }
    .field input[type="number"]::-webkit-outer-spin-button,
    .field input[type="number"]::-webkit-inner-spin-button { appearance: none; margin: 0; }
    .panels { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; grid-area: panels; min-height: 0; height: 100%; }
    @media (max-width: 768px) {
      .panels { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    }
    #drop {
      border: 1px dashed #2a2a2a;
      background: #000;
      color: #8a8a8a;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
    }
    #drop.hot { background: #f2f2f2; color: #000; border-color: #f2f2f2; }
    #tree {
      border: 1px solid #2a2a2a;
      background: #000;
      color: #8a8a8a;
      padding: 16px;
      min-height: 0;
      height: 100%;
    }
    .actions { display: flex; gap: 8px; }
    .btn { flex: 1; height: 44px; border: 1px solid #2a2a2a; background: #000; color: #8a8a8a; font-weight: 500; }
    .btn.primary { background: #f2f2f2; color: #000; border-color: #f2f2f2; }
    .btn:disabled { opacity: 0.3; cursor: default; }
    .line { margin: 0; font-size: 0.875rem; color: #8a8a8a; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Spine Skeleton Resize</h1>
      <div class="chips">
        <button class="chip" id="bake" type="button" aria-pressed="true">Bake</button>
        <button class="chip" id="center" type="button" aria-pressed="true">Center</button>
      </div>
    </header>
    <div class="fields">
      <label class="field" title="Fit the longer side to this many pixels">
        <input type="radio" name="scale-mode" value="side" checked />
        <input id="size" type="number" min="16" max="8192" value="300" inputmode="numeric" aria-label="Longest side in pixels" />
        <span class="unit">px</span>
      </label>
      <label class="field" title="2 is twice as large, 0.5 is half">
        <input type="radio" name="scale-mode" value="times" />
        <input id="times" type="number" min="0.01" max="100" step="0.01" value="2" inputmode="decimal" aria-label="How many times larger or smaller" />
        <span class="unit">×</span>
      </label>
      <label class="field" title="100 is twice as large, -50 is half, 0 is no change">
        <input type="radio" name="scale-mode" value="percent" />
        <input id="percent" type="number" min="-99" max="9900" step="1" value="0" aria-label="Percent increase or decrease" />
        <span class="unit">%</span>
      </label>
    </div>
    <div class="panels">
      <div id="drop">
        <span>.json .skel .spine .atlas .png .zip</span>
        <span id="list"></span>
      </div>
      <div id="tree">
        <div id="tree-placeholder" style="padding:24px 12px; color:#666; font-size:0.9rem;">
          <div>Tree</div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button id="go" class="btn primary" type="button" disabled>Resize</button>
      <button id="with_spine" class="with_spine" type="button" aria-pressed="false">with Spine</button>
    <style>
      .with_spine {
        background: #f2f2f2;
        color: #000;
        border-color: #f2f2f2;
      }
      .with_spine.active {
        background: #000;
        color: #f2f2f2;
        border-color: #2a2a2a;
      }
    </style>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const withSpineBtn = document.getElementById('with_spine');
        const treePlaceholder = document.getElementById('tree-placeholder');
        const treeElement = document.getElementById('tree');
        
        withSpineBtn.addEventListener('click', function() {
          // Toggle tree placeholder state
          const isActive = withSpineBtn.classList.contains('active');
          if (isActive) {
            treePlaceholder.style.display = 'block';
            treePlaceholder.innerHTML = '<div>Tree</div>';
            withSpineBtn.classList.remove('active');
            withSpineBtn.setAttribute('aria-pressed', 'false');
          } else {
            treePlaceholder.style.display = 'none';
            withSpineBtn.classList.add('active');
            withSpineBtn.setAttribute('aria-pressed', 'true');
          }
          
          // Open system file dialog so user can select the file from their Spine editor
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = '.json,.skel,.spine,.atlas,.png,.jpg,.jpeg,.webp,.zip';
          input.onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
              // User selected a file - process it
              const reader = new FileReader();
              reader.onload = function(event) {
                const content = event.target.result;
                // Process the spine file content here
                console.log('Selected file:', file.name);
                console.log('File size:', file.size);
                
                // Trigger the resize logic with the loaded file
                if (window.processSpineFile) {
                  window.processSpineFile(content, file);
                } else {
                  alert('Файл ' + file.name + ' выбран. Размер: ' + file.size + ' байт.
Обработайте файл дальше в редакторе.');
                }
              };
              // Detect file type and read accordingly
              if (file.name.endsWith('.spine') || file.name.endsWith('.skel') || file.name.endsWith('.bytes')) {
                reader.readAsArrayBuffer(file);
              } else {
                reader.readAsText(file);
              }
            }
          };
          // Open the file picker dialog (system-level file selection)
          input.click();
        });
      });
    </script>
    </div>
    
  </main>
  <input id="file" type="file" multiple hidden accept=".zip,.json,.skel,.bytes,.spine,.atlas,.txt,.png,.jpg,.jpeg,.webp" />
  <script src="app.js"></script>
</body>
</html>
