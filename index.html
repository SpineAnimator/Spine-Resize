<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spine Resize Skeleton</title>
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Crect x='7' y='7' width='18' height='18' fill='none' stroke='%23f2f2f2' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #f2f2f2; }
    body {
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      overflow: hidden;
    }
    main {
      height: 100dvh;
      max-width: 48rem;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      gap: 12px;
      padding: 16px;
    }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
    h1 { margin: 0; min-width: 0; flex: 1 1 12rem; overflow: visible; white-space: normal; line-height: 1.15; font-size: 1rem; font-weight: 500; letter-spacing: -0.02em; }
    button, label { font: inherit; }
    button { cursor: pointer; }
    .chip, .mode, #drop, #go {
      border: 1px solid #2a2a2a;
      background: #000;
      color: #8a8a8a;
    }
    .chip { height: 44px; padding: 0 12px; }
    .chip[aria-pressed="true"] { background: #f2f2f2; color: #000; border-color: #f2f2f2; }
    .modes { display: flex; flex-direction: column; gap: 8px; }
    .mode {
      width: 100%;
      min-width: 0;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      font-size: 0.875rem;
      cursor: pointer;
    }
    .mode:has(input[type="radio"]:checked) {
      background: #f2f2f2;
      color: #000;
      border-color: #f2f2f2;
    }
    .mode input[type="radio"] {
      appearance: none;
      width: 14px;
      height: 14px;
      margin: 0;
      border: 1.5px solid currentColor;
      border-radius: 50%;
      background: transparent;
      color: inherit;
      flex: 0 0 auto;
    }
    .mode input[type="radio"]:checked {
      background: radial-gradient(circle, currentColor 0 45%, transparent 50%);
    }
    .mode .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mode input[type="number"] {
      width: 4.6rem;
      margin-left: auto;
      background: transparent;
      color: inherit;
      border: 0;
      text-align: right;
      font: inherit;
      outline: none;
    }
    .mode input[type="number"]::-webkit-outer-spin-button,
    .mode input[type="number"]::-webkit-inner-spin-button { appearance: none; margin: 0; }
    .unit { width: 1.1rem; text-align: right; }
    #drop {
      min-height: 0; display: flex; flex-direction: column; align-items: stretch; text-align: left; padding: 16px;
    }
    #drop.hot { background: #f2f2f2; color: #000; }
    #list { margin-top: 12px; min-height: 0; overflow: auto; font-size: 0.875rem; line-height: 1.5; color: #f2f2f2; }
    #drop.hot #list { color: #000; }
    #list span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #go { height: 48px; background: #f2f2f2; color: #000; border-color: #f2f2f2; font-weight: 500; font-size: 1rem; }
    #go:disabled { opacity: 0.3; cursor: default; }
    #line { margin: 0; font-size: 0.875rem; color: #8a8a8a; white-space: normal; overflow: visible; }
    #line a { color: #f2f2f2; }
    @media (min-width: 640px) { main { padding: 24px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Spine Resize Skeleton</h1>
      <button class="chip" id="bake" type="button" aria-pressed="true">Bake</button>
      <button class="chip" id="center" type="button" aria-pressed="true">Center</button>
    </header>
    <div class="modes" role="radiogroup" aria-label="Resize method">
      <label class="mode" title="Fit the longer side to this many pixels">
        <input type="radio" name="scale-mode" value="side" checked />
        <span class="name">Longest side in pixels</span>
        <input id="size" type="number" min="16" max="8192" value="300" inputmode="numeric" aria-label="Longest side in pixels" />
        <span class="unit">px</span>
      </label>
      <label class="mode" title="2 is twice as large, 0.5 is half">
        <input type="radio" name="scale-mode" value="times" />
        <span class="name">Times larger or smaller</span>
        <input id="times" type="number" min="0.01" max="100" step="0.01" value="2" inputmode="decimal" aria-label="How many times larger or smaller" />
        <span class="unit">×</span>
      </label>
      <label class="mode" title="100 is twice as large, -50 is half, 0 is no change">
        <input type="radio" name="scale-mode" value="percent" />
        <span class="name">Percent up or down</span>
        <input id="percent" type="number" min="-99" max="9900" step="1" value="0" aria-label="Percent increase or decrease" />
        <span class="unit">%</span>
      </label>
    </div>
    <button id="drop" type="button">
      <span>.json .skel .spine .atlas .png .zip</span>
      <span id="list"></span>
    </button>
    <button id="go" type="button" disabled>Resize</button>
    <p id="line">.json Import Data · .spine Open</p>
  </main>
  <input id="file" type="file" multiple hidden accept=".zip,.json,.skel,.bytes,.spine,.atlas,.txt,.png,.jpg,.jpeg,.webp" />
  <script src="app.js"></script>
</body>
</html>
