<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spine Skeleton Resize</title>
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http\://www\.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%238a1c1c'/%3E%3Crect x='7' y='7' width='18' height='18' fill='none' stroke='%23f2f2f2' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com/" />
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600\&family=Inter:wght@400;500;600;700\&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #f2f2f2; }
    body {
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      overflow: hidden;
    }
    main {
      width: 100%;
      height: 100dvh;
      margin: 0;
      padding: 24px 32px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "header"
        "fields"
        "panels"
        "actions"
        "status";
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      gap: 16px;
    }
    /* Mobile styles only for actual mobile devices (touch) */
    @media (pointer: coarse) and (max-width: 768px) {
      body { overflow: auto; }
      main {
        height: auto;
        min-height: 100dvh;
        padding: 16px;
        grid-template-rows: auto auto minmax(260px, 1fr) auto auto;
      }
      .fields { grid-template-columns: minmax(0, 1fr); }
      .panels { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(220px, 1fr) minmax(180px, auto); }
    }
    /* Hide labels "Multiplier" and "Percentage" on narrow screens (<600px) */
    @media (max-width: 600px) {
      .field .name { display: none; }
    }
    header { grid-area: header; display: flex; flex-wrap: nowrap; align-items: center; gap: 10px; min-width: 0; overflow: hidden; }
    h1 { margin: 0; min-width: 0; flex: 1 1 auto; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 1.15; font-size: 1.2rem; font-weight: 500; letter-spacing: -0.02em; }
    .chip { flex: 0 1 auto; min-width: 0; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button, label { font: inherit; }
    button { cursor: pointer; }
    .chips { display: flex; gap: 8px; }
    .chip { height: 44px; padding: 0 12px; border: 1px solid #2a2a2a; background: #000; color: #8a8a8a; }
    .chip[aria-pressed="true"] { background: #e8e8e8; color: #000; border-color: #f2f2f2; }
    .fields { grid-area: fields; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; min-width: 0; }
    .field {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid #2a2a2a;
      background: #000;
      color: #8a8a8a;
      min-height: 44px;
      white-space: nowrap;
    }
    /* Number input + unit: number right-aligned, unit left-aligned right next to it */
    .field input[type="number"] {
      width: 100%;
      max-width: 80px;
      background: transparent;
      color: inherit;
      border: 0;
      font: inherit;
      font-size: 1rem;
      outline: none;
      text-align: right;
      padding-right: 0;
    }
    .field .unit {
      white-space: nowrap;
      padding-left: 0;
      margin-left: 0;
    }
    .field input[type="radio"] {
      appearance: none;
      width: 14px;
      height: 14px;
      border: 1.5px solid currentColor;
      border-radius: 50%;
      background: transparent;
      color: inherit;
    }
    .field input[type="radio"]:checked {
      background: radial-gradient(circle, currentColor 0 45%, transparent 50%);
    }
    .field input[type="number"]::-webkit-outer-spin-button,
    .field input[type="number"]::-webkit-inner-spin-button { appearance: none; margin: 0; }
    .panels { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; grid-area: panels; min-height: 0; height: 100%; }
    @media (pointer: coarse) and (max-width: 768px) {
      .panels { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    }
    #drop {
      border: 1px dashed #2a2a2a;
      background: #000;
      color: #8a8a8a;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
    }
    #drop.hot { background: #e8e8e8; color: #000; border-color: #f2f2f2; }
    #list { margin-top: 12px; min-height: 0; overflow: auto; font-size: 0.875rem; color: inherit; }
    #list span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #drop.hot #list { color: #000; }
    #tree {
      border: 1px solid #2a2a2a;
      background: #000;
      color: #8a8a8a;
      padding: 16px;
      min-height: 0;
      height: 100%;
    }
    .actions { display: flex; gap: 8px; grid-area: actions; width: 100%; }
    .btn {
      flex: 1;
      height: 44px;
      border: 1px solid #2a2a2a;
      background: #000;
      color: #8a8a8a;
      font-weight: 500;
    }
    .btn.white {
      background: #f2f2f2;
      color: #000;
      border-color: #f2f2f2;
    }
    .btn:disabled {
      opacity: 0.3;
      cursor: default;
    }
    /* with Spine button - using SPINE texture from image */
    .with_spine {
      flex: 0 0 auto;
      width: 180px;
      height: 44px;
      border: none;
      background: url('spine-button-texture.png') center / cover no-repeat;
      color: #f2f2f2;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 10px;
      position: relative;
    }
    .with_spine::before {
      content: "with";
      font-weight: 400;
      font-size: 1.3rem; /* 3pt larger than base */
      opacity: 0.9;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      /* Adaptive: from left edge (10px padding) to center minus 10px, centered in that space */
      width: calc(50% - 20px); /* half button width minus 10px left padding minus 10px from center */
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .with_spine:hover {
      filter: brightness(1.1);
    }
    .with_spine:active {
      filter: brightness(0.95);
    }
    .line { margin: 0; font-size: 0.875rem; color: #8a8a8a; }
    #status { grid-area: status; width: 100%; font-size: 0.875rem; color: #f2f2f2; white-space: normal; overflow: visible; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Spine Skeleton Resize</h1>
      <button class="chip" id="bake" type="button" aria-pressed="true">Bake</button>
      <button class="chip" id="center" type="button" aria-pressed="true">Center</button>
    </header>
    <div class="fields">
      <label class="field" title="Fit the longer side to this many pixels">
        <input type="radio" name="scale-mode" value="side" checked />
        <input id="size" type="number" min="16" max="8192" value="300" inputmode="numeric" aria-label="Longest side in pixels" />
        <span class="unit">px</span>
      </label>
      <label class="field" title="2 is twice as large, 0.5 is half">
        <input type="radio" name="scale-mode" value="times" />
        <span class="name">Multiplier</span>
        <input id="times" type="number" min="0.01" max="100" step="0.01" value="2" inputmode="decimal" aria-label="Multiplier: 2 is twice as large, 0.5 is half" />
        <span class="unit">×</span>
      </label>
      <label class="field" title="100 is twice as large, -50 is half, 0 is no change">
        <input type="radio" name="scale-mode" value="percent" />
        <span class="name">Percentage</span>
        <input id="percent" type="number" min="-99" max="9900" step="1" value="0" aria-label="Percentage change: 100 is twice as large, -50 is half, 0 is no change" />
        <span class="unit">%</span>
      </label>
    </div>
    <div class="panels">
      <div id="drop">
        <span>.json .skel .spine .atlas .png .zip</span>
        <span id="list"></span>
      </div>
      <div id="tree">
        <div id="tree-placeholder" style="padding:24px 12px; color:#666; font-size:0.9rem;">
          <div>Tree</div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button id="go" class="btn" type="button" disabled>Resize</button>
      <button id="with_spine" class="with_spine" type="button"></button>
    </div>
    <p id="status" style="display:none;">.json Import Data · .spine Open</p>
  </main>
  <input id="file" type="file" multiple hidden accept=".zip,.json,.skel,.bytes,.spine,.atlas,.txt,.png,.jpg,.jpeg,.webp" />
  <script src="https://spineanimator.github.io/Spine-Resize/app.js"></script>
  <script src="https://spineanimator.github.io/Spine-Resize/spine-bridge/content.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  
</body>
</html>
